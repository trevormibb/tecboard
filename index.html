<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Tecboard App - monitore suas aplicações em tempo real, para que elas nunca saiam do ar sem você saber.">

    <link rel="icon" href="favicon-tecboard-roxo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">

    <title>Tecboard</title>

    <meta name="google-site-verification" content="lxudTUXvX8F-BTd4tq0wOFV1R9XbADLa1htBArqKqks">
</head>

<body>
    <header class="header">
        <img src="img/white-logo.png" alt="Tecboard" width="220" height="auto">
    </header>

    <main>
        <section class="hero">
            <h1><span>Fique de olho</span><br>no que importa</h1>

            <p>
                Monitoramento em tempo real com alertas inteligentes para sua
                aplicação nunca sair do ar sem você saber.
            </p>

            <a class="hero-button" href="#" title="Teste a versão demo do App Tecboard">Testar versão demo</a>

            <picture class="hero-image">
                <source media="(max-width: 480px)" srcset="img/celulares-sobrepostos-mobile.png">

                <img
                    src="img/celulares-sobrepostos-desktop.png"
                    alt="Celulares pretos sobrepostos com sombra roxa"
                    width="792"
                    height="auto"
                    fetchpriority="high"
                    decoding="async"
                >
            </picture>
        </section>
    </main>
</body>
</html>
